<!doctype html>
<html lang="es" class="dark">
<head>
<meta charset="utf-8">
<title>Toolbox Patagonia Trelew — Cotizador Inmediato de Repuestos</title>
<base href="/">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<link rel="icon" type="image/x-icon" href="favicon.ico?v=2">
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Inter:wght@300;400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
<style>
body{background-color:#E2A774;background-image:radial-gradient(ellipse 110% 70% at 90% 15%, #E57D68 0%, #D96552 40%, transparent 80%),radial-gradient(ellipse 90% 80% at 15% 15%, #F5D3B3 0%, #E8B98C 50%, transparent 85%),radial-gradient(ellipse 100% 75% at 50% 95%, #C98850 0%, #B8733B 60%, transparent 90%),linear-gradient(145deg, #F3D2B2 0%, #E6AC7E 35%, #DC7862 70%, #C47248 100%);background-attachment:fixed;color:#171412;font-family:'Plus Jakarta Sans',-apple-system,BlinkMacSystemFont,Inter,sans-serif}
.glass-apple{background:rgba(18,18,20,.78);backdrop-filter:blur(32px) saturate(190%);-webkit-backdrop-filter:blur(32px) saturate(190%);border:1px solid rgba(255,255,255,.12)}
.glass-card-interactive{background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.08);transition:all 200ms cubic-bezier(.16,1,.3,1)}
.glass-card-interactive:hover{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.3);transform:translateY(-2px)}
.glass-card-interactive.active-part{background:rgba(255,255,255,.12);border-color:#fff;box-shadow:0 0 25px -4px rgba(255,255,255,.25)}
.fade-slide-up{animation:appleSlideUp 350ms cubic-bezier(.16,1,.3,1) forwards}
@keyframes appleSlideUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
</style>
</head>
<body class="bg-surface text-on-surface min-h-screen flex flex-col"><app-root></app-root></body>
</html>
